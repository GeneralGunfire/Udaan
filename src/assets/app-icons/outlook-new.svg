<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><g pointer-events="none">
  <!--
    New Outlook: the blue envelope with the white "O" on its left panel.
    The previous drawing was a flat blue square with a monoline ring, which
    read as a generic badge rather than Outlook at tile size.
  -->
  <defs>
    <linearGradient id="onBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b86e3"/>
      <stop offset="1" stop-color="#1663c7"/>
    </linearGradient>
    <linearGradient id="onFlap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53a3f0"/>
      <stop offset="1" stop-color="#2d80da"/>
    </linearGradient>
  </defs>

  <!-- Envelope body -->
  <rect x="14" y="12" width="32" height="26" rx="3.5" fill="url(#onBody)"/>
  <!-- Opened flap, folding down from the top edge -->
  <path d="M14 15.5a3.5 3.5 0 0 1 3.5-3.5h25a3.5 3.5 0 0 1 3.5 3.5L30 27z" fill="url(#onFlap)"/>
  <!-- The O panel sits in front, as in the real mark -->
  <rect x="2" y="9" width="24" height="30" rx="4" fill="#0f6cbd"/>
  <ellipse cx="14" cy="24" rx="6.6" ry="8" fill="none" stroke="#ffffff" stroke-width="3.3"/>
</g></svg>

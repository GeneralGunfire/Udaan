[package]
name = "spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# M1 gate: does a single native process drawing through the Windows composition
# engine give us transparent windows, compositor-side 3D and near-zero idle cost
# on the target machine (2012 i5, DX11.0 Intel HD, DisplayLink USB monitor)?

[dependencies]
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Numerics",
  "Graphics",
  "Graphics_DirectX",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

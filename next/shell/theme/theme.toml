# Udaan Next design language. Hot-reloaded: save this file and the shell rebuilds its
# visuals (watch the console for "theme: reloaded" or a parse warning).
#
# Format: [section] headers, `key = value`. Values: number (12, 0.55), colour
# (#RRGGBB or #RRGGBBAA), number list (220, 0.55), string ("blur"), bool (true).
# Unknown keys are ignored; a missing key falls back to the compiled default, so a
# typo can never take the shell down.
#
# Geometry below is MEASURED from the macOS reference screenshot and scaled to this
# 1920x1080 screen: 55 px dock icons, 6 px gaps, 17 px off the bottom edge.

# ---------------------------------------------------------------------------------
# Type: Montserrat Variable, loaded as a PRIVATE font from theme/fonts (never installed
# system-wide). Poppins was dropped from the original Udaan, so Montserrat carries both
# display and body. Weight 200-300 for oversized display type, 500-600 for UI.
[type]
family        = "Montserrat"
mono          = "Cascadia Mono"
icons         = "Segoe MDL2 Assets"
caption       = 11
label         = 11
body          = 12
title         = 15
headline      = 20
display       = 96
display_weight = 300
clock_bar     = 12

# ---------------------------------------------------------------------------------
# Spacing on a 4 px grid, radii. Logical px; scaled per monitor DPI.
[space]
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32

[radius]
sm     = 6
md     = 10
lg     = 16
dock   = 22
widget = 16
icon   = 12

# ---------------------------------------------------------------------------------
# Elevation: compositor drop shadows. "blur radius, y offset, opacity".
# Neutral black, never coloured (no glows anywhere).
[elevation]
rest  = 10, 2, 0.18
float = 30, 10, 0.34
lift  = 18, 6, 0.26

# ---------------------------------------------------------------------------------
# Glass. Measured on this PC (see the win10-glass-material note): accent blur-behind
# on a window DOES respect a composition rounded clip. The blur is strong, so the tint
# over it is almost nothing; there is NO hairline border and NO dark slab. Light comes
# from one direction (above): a soft highlight on the top edge, shadow below.
[material]
mode          = "blur"   # "blur" | "none" (opaque fallback)
edge          = 1
border        = 0
blur          = 30     # px radius of the wallpaper blur behind dock glass (computed once)

# ---------------------------------------------------------------------------------
# Colour: the original Udaan monochrome. Charcoal with real depth (never pure black or
# white), warm off-white text #faf8f4 at 96/72/52 percent, and ONE accent, the logo
# blue #3072f0, used only for active/live/selected/focus (the running-app dot).
# Danger is a desaturated brick red. No glows anywhere: shadows are neutral dark.
[dark]
glass_tint     = #FAF8F40E   # barely a film over a strong blur
glass_opaque   = #1C1C20F2   # when transparency is off (charcoal surface)
glass_edge     = #FAF8F42E   # top-edge highlight
glass_border   = #00000000
glass_shade    = #0A0A0C22
text           = #FAF8F4F5   # 96%
text_secondary = #FAF8F4B8   # 72%
text_tertiary  = #FAF8F485   # 52%
accent         = #3072F0
accent_text    = #FAF8F4
danger         = #D9736A
indicator      = #3072F0
icon_plate     = #00000000
separator      = #FAF8F41A
widget_tint    = #131316E6   # name tag fill
widget_edge    = #FAF8F426
shadow         = #0A0A0C

[light]
glass_tint     = #FAF8F440
glass_opaque   = #EFEDE8F2
glass_edge     = #FFFFFFB0
glass_border   = #00000000
glass_shade    = #0A0A0C10
text           = #17171AF5
text_secondary = #17171AB8
text_tertiary  = #17171A85
accent         = #3072F0
accent_text    = #FAF8F4
danger         = #C25A50
indicator      = #3072F0
icon_plate     = #00000000
separator      = #17171A1A
widget_tint    = #FAF8F4E6
widget_edge    = #FFFFFFC0
shadow         = #0A0A0C

# ---------------------------------------------------------------------------------
# Motion. Springs run on the compositor and stop by themselves; nothing loops.
# "period ms, damping ratio". Damping 1.0 = critically damped (no overshoot).
# Dock magnification is computed directly per mouse move, NOT sprung per sample:
# springs only carry the wave's enter and exit.
[motion]
tap        = 140, 0.70
hover      = 220, 0.80
magnify    = 260, 0.90   # enter/exit of the magnification wave only
enter      = 520, 0.80
exit       = 200, 1.00
slide      = 320, 1.00
settle     = 700, 0.80
hover_lift = 2
press_scale = 0.90

# ---------------------------------------------------------------------------------
# Dock geometry, measured from the reference and scaled to 1080p.
[dock]
icon          = 55      # measured: 44 px in a 865 px-tall reference -> 55 at 1080
gap           = 6       # icons nearly touch
pad_x         = 9
pad_y         = 7
bottom        = 17      # measured gap from the screen's bottom edge
magnify_max   = 1.45
magnify_sigma = 1.30
magnify_rise  = 16
tilt          = 11      # degrees of 3D tilt toward the cursor (set on mouse move only, 0 at rest)
indicator     = 4
reserve       = true    # keep an AppBar strip so maximised windows stop above it

# ---------------------------------------------------------------------------------
# Top menu bar: text on a faint darkening, NO fill and NO border (as measured).
[topbar]
height    = 26
pad_x     = 14
item_gap  = 18
darken    = 0.22        # how much the bar strip darkens the wallpaper, 0 = nothing

# ---------------------------------------------------------------------------------
# Desktop layer.
[desktop]
wallpaper      = "wallpapers/alhambra.jpg"   # rendered ONLY in our layer; the Windows
                                             # wallpaper setting is never changed.
photo          = "wallpapers/machu-picchu.jpg"
widget_width   = 220
widget_margin  = 22
widget_gap     = 14
vignette       = 0.34
